name: Security Red Team

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/security-red-team.yaml"
      - "README.md"
      - "PUBLICATION_TODO.md"
      - "go.mod"
      - "go.sum"
      - "pkg/agtp/**"
      - "pkg/atls/**"
      - "pkg/clients/**"
      - "pkg/production/**"
      - "cmd/redis-failover-redteam/**"
      - "examples/a2a-multiprocess/**"
      - "examples/protected-change-consumer/**"
      - "docs/draft06-a2a-profile.md"
      - "docs/API_COMPATIBILITY.md"
      - "docs/production-deployment-profile.md"
      - "docs/azure-sev-snp-attestation-bridge.md"
      - "docs/redis-failover-runbook.md"
      - "docs/security-red-team-tests.md"
      - "docs/live-red-team-report.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/security-red-team.yaml"
      - "README.md"
      - "PUBLICATION_TODO.md"
      - "go.mod"
      - "go.sum"
      - "pkg/agtp/**"
      - "pkg/atls/**"
      - "pkg/clients/**"
      - "pkg/production/**"
      - "cmd/redis-failover-redteam/**"
      - "examples/a2a-multiprocess/**"
      - "examples/protected-change-consumer/**"
      - "docs/draft06-a2a-profile.md"
      - "docs/API_COMPATIBILITY.md"
      - "docs/production-deployment-profile.md"
      - "docs/azure-sev-snp-attestation-bridge.md"
      - "docs/redis-failover-runbook.md"
      - "docs/security-red-team-tests.md"
      - "docs/live-red-team-report.md"

permissions:
  contents: read

jobs:
  live-red-team:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum

      - name: Run Direct-Agent security red-team tests
        run: |
          GOTOOLCHAIN=go1.26.6+auto go test -v -race -count=1 \
            ./pkg/agtp \
            ./pkg/atls/identitypolicy \
            ./pkg/atls/sbaipv2 \
            ./pkg/clients \
            ./pkg/production \
            ./cmd/redis-failover-redteam \
            ./examples/protected-change-consumer \
            ./examples/a2a-multiprocess
