name: ASB S3 Linux

on:
  push:
    branches: [main, feat/aws-s3-product, fix/s3-operational-qa]
    paths:
      - '.github/workflows/aws-s3-linux.yaml'
      - 'pkg/leastprivilege/**'
      - 'internal/s3product/**'
      - 'cmd/asb-s3/**'
      - 'scripts/run-s3-operations.cjs'
      - 'scripts/run-s3-systemd-live.cjs'
      - 'scripts/s3-qa-evidence.py'
      - 'packaging/s3/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - '.github/workflows/aws-s3-linux.yaml'
      - 'pkg/leastprivilege/**'
      - 'internal/s3product/**'
      - 'cmd/asb-s3/**'
      - 'scripts/run-s3-operations.cjs'
      - 'scripts/run-s3-systemd-live.cjs'
      - 'scripts/s3-qa-evidence.py'
      - 'packaging/s3/**'
  workflow_dispatch:
    inputs:
      aws_confirmation:
        description: Optional; type read-explicit-fixture to run the authorized AWS fixture after Linux checks
        type: string
        required: false
        default: ''
      operations_minutes:
        description: Optional dedicated-user operations lab; still requires read-explicit-fixture
        type: choice
        options: ['0', '15', '45']
        default: '0'
      systemd_identity:
        description: Optional real OIDC expiry and renewal under systemd; requires operations_minutes=0
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
      - name: Verify dependencies
        run: go mod verify
      - name: Check least-privilege and AWS components
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          uname -s > evidence/operating-system.txt
          go test -race -count=1 -timeout=12m -json ./pkg/leastprivilege/... ./internal/s3product ./cmd/asb-s3 > evidence/tests.jsonl
          go vet ./pkg/leastprivilege/... ./internal/s3product ./cmd/asb-s3
          # Compile the opt-in AWS gate without calling AWS or treating a skip as qualification.
          go test -c -tags awsiam_live -o "$RUNNER_TEMP/asb-s3-live.test" ./pkg/leastprivilege/awsiam
          go test -c -tags awsiam_live -o "$RUNNER_TEMP/asb-s3-product-live.test" ./internal/s3product
      - name: Build and exercise the Linux product binary
        id: product-build
        run: |
          go build -trimpath -o evidence/asb-s3 ./cmd/asb-s3
          ./evidence/asb-s3 init-store --directory "$RUNNER_TEMP/asb-s3-journal" > evidence/initialized.json
          mkdir -m 700 "$RUNNER_TEMP/asb-s3-backups"
          ./evidence/asb-s3 backup --directory "$RUNNER_TEMP/asb-s3-journal" --output "$RUNNER_TEMP/asb-s3-backups/snapshot.sqlite" > evidence/backup.json
          ./evidence/asb-s3 restore --directory "$RUNNER_TEMP/asb-s3-restored" --input "$RUNNER_TEMP/asb-s3-backups/snapshot.sqlite" --sha256 "$(jq -r .sha256 evidence/backup.json)" > evidence/restored.json
          test "$(jq -r .namespace evidence/initialized.json)" != "$(jq -r .namespace evidence/restored.json)"
          sha256sum evidence/asb-s3 > evidence/binary.sha256
          sudo install -m 0755 evidence/asb-s3 /usr/local/bin/asb-s3
          systemd-analyze verify packaging/s3/asb-s3.service 2> evidence/systemd-verify.txt || {
            cat evidence/systemd-verify.txt
            exit 1
          }
      - name: Measure bounded operational QA on Linux
        env:
          ASB_QA_CAPACITY: '1'
        run: |
          set -o pipefail
          export ASB_QA_BINARY="$PWD/evidence/asb-s3"
          go test -count=1 -timeout=6m -v ./pkg/leastprivilege -run '^TestSQLiteHistoryMonitoringAndBackupQualification$' | tee evidence/qa-capacity.txt
          go test -count=1 -tags awsiam_live -timeout=6m -v ./internal/s3product -run '^TestOfflineProduct' | tee evidence/qa-product.txt
      - name: Verify real storage exhaustion and the installed systemd unit
        id: storage-systemd
        if: ${{ !cancelled() && steps.product-build.outcome == 'success' }}
        run: |
          set -o pipefail
          fixture="$RUNNER_TEMP/asb-qa-full"
          mkdir -p "$fixture"
          sudo mount -t tmpfs -o size=32m,mode=0700 tmpfs "$fixture"
          trap 'sudo umount "$fixture"' EXIT
          sudo chown "$(id -u):$(id -g)" "$fixture"
          ASB_QA_FULL_DIRECTORY="$fixture" go test -count=1 -timeout=60s -v ./pkg/leastprivilege -run '^TestSQLiteFilesystemFullRecovery$' | tee evidence/qa-full.txt
          sudo useradd --system --home-dir /var/lib/asb-s3 --shell /usr/sbin/nologin asb-s3
          sudo install -d -o asb-s3 -g asb-s3 -m 0700 /var/lib/asb-s3 /etc/asb-s3
          sudo install -m 0644 packaging/s3/asb-s3.service /etc/systemd/system/asb-s3.service
          sudo install -D -m 0644 packaging/s3/journald-asb-s3.conf /etc/systemd/journald@asb-s3.conf.d/retention.conf
          go test -c -tags awsiam_live -o "$RUNNER_TEMP/asb-qa-product.test" ./internal/s3product
          sudo env TMPDIR=/var/lib/asb-s3 ASB_QA_SYSTEMD=1 ASB_QA_BINARY=/usr/local/bin/asb-s3 "$RUNNER_TEMP/asb-qa-product.test" -test.run '^TestOfflineSystemdLifecycle$' -test.v -test.timeout=180s | tee evidence/qa-systemd.txt
      - name: Boot the installed unit twice in a disposable Linux container
        if: ${{ !cancelled() && steps.storage-systemd.outcome == 'success' }}
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends systemd-container debootstrap
          rootfs="$RUNNER_TEMP/asb-qa-rootfs"
          sudo debootstrap --variant=minbase --include=systemd-sysv,dbus noble "$rootfs" http://archive.ubuntu.com/ubuntu/ > evidence/qa-rootfs-build.txt 2>&1
          sudo chroot "$rootfs" useradd --system --uid "$(id -u asb-s3)" --home-dir /var/lib/asb-s3 --shell /usr/sbin/nologin asb-s3
          sudo install -D -m 0755 evidence/asb-s3 "$rootfs/usr/local/bin/asb-s3"
          sudo install -D -m 0644 packaging/s3/asb-s3.service "$rootfs/etc/systemd/system/asb-s3.service"
          sudo install -D -m 0644 packaging/s3/journald-asb-s3.conf "$rootfs/etc/systemd/journald@asb-s3.conf.d/retention.conf"
          sudo mkdir -p "$rootfs/etc/asb-s3" "$rootfs/var/lib/asb-s3"
          sudo systemctl --root="$rootfs" enable asb-s3.service
          sudo systemctl --root="$rootfs" set-default multi-user.target
          sudo env TMPDIR=/var/lib/asb-s3 ASB_QA_ROOTFS="$rootfs" ASB_QA_BINARY=/usr/local/bin/asb-s3 "$RUNNER_TEMP/asb-qa-product.test" -test.run '^TestOfflineSystemdBoot$' -test.v -test.timeout=240s | tee evidence/qa-boot.txt
      - name: Lint the Linux product paths
        if: ${{ !cancelled() }}
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.1
          args: --build-tags awsiam_live ./pkg/leastprivilege/... ./internal/s3product/... ./cmd/asb-s3/...
      - name: Record complete offline QA evidence
        if: always()
        env:
          ASB_QA_PRIOR_STATUS: ${{ job.status }}
        run: python3 scripts/s3-qa-evidence.py evidence
      - name: Save non-secret conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asb-s3-linux-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
  aws-qualification:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ToppyMicroServices/agents-secure-binding' && inputs.aws_confirmation == 'read-explicit-fixture'
    needs: conformance
    runs-on: ubuntu-24.04
    environment: aws-s3-live
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      GOWORK: 'off'
    steps:
      - name: Require the private environment fixture
        env:
          ASB_FIXTURE: ${{ secrets.ASB_AWS_LIVE_FIXTURE_JSON }}
        run: |
          if [ -z "$ASB_FIXTURE" ]; then
            echo '::error::Environment aws-s3-live must supply ASB_AWS_LIVE_FIXTURE_JSON.'
            exit 1
          fi
      - name: Require separate disposable identity and operations labs
        if: inputs.systemd_identity && inputs.operations_minutes != '0'
        run: |
          echo '::error::Run systemd_identity with operations_minutes=0 in its own disposable job.'
          exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
      - name: Load the Linux conformance binary
        uses: actions/download-artifact@v4
        with:
          name: asb-s3-linux-${{ github.run_id }}
          path: ${{ runner.temp }}/asb-s3-qualified
      - name: Build the opt-in gate before issuing a short-lived identity
        run: |
          go mod verify
          go test -c -tags awsiam_live -o "$RUNNER_TEMP/asb-s3-live.test" ./pkg/leastprivilege/awsiam
          go test -c -tags awsiam_live -o "$RUNNER_TEMP/asb-s3-product-live.test" ./internal/s3product
          qualified="$RUNNER_TEMP/asb-s3-qualified"
          test "$(cat "$qualified/source-commit.txt")" = "$GITHUB_SHA"
          test "$(cat "$qualified/operating-system.txt")" = Linux
          test "$(sha256sum "$qualified/asb-s3" | cut -d ' ' -f 1)" = "$(cut -d ' ' -f 1 "$qualified/binary.sha256")"
          install -m 0755 "$qualified/asb-s3" "$RUNNER_TEMP/asb-s3-live"
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          uname -s > evidence/operating-system.txt
          aws --version > evidence/aws-cli-version.txt
      - name: Load the private fixture and project a fresh GitHub OIDC token
        uses: actions/github-script@v8
        env:
          ASB_FIXTURE: ${{ secrets.ASB_AWS_LIVE_FIXTURE_JSON }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            let fixture;
            try {
              if (!process.env.ASB_FIXTURE || Buffer.byteLength(process.env.ASB_FIXTURE) > 65536) throw new Error();
              fixture = JSON.parse(process.env.ASB_FIXTURE);
              if (!fixture.specification || !fixture.resource || !fixture.denied_resource || fixture.credentials_file) throw new Error();
            } catch {
              core.setFailed('An explicit private OIDC fixture is required in environment aws-s3-live.');
              return;
            }
            const directory = path.join(process.env.RUNNER_TEMP, 'asb-aws-private');
            fs.mkdirSync(directory, {mode: 0o700});
            const token = await core.getIDToken('sts.amazonaws.com');
            core.setSecret(token);
            // Record only public identity claims; AWS verifies the signed token.
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
            const publicClaims = {};
            for (const name of ['iss', 'aud', 'sub', 'repository_id', 'repository_owner_id', 'ref', 'environment', 'sha']) {
              if (claims[name] !== undefined) publicClaims[name] = claims[name];
            }
            fs.writeFileSync('evidence/oidc-claims.json', JSON.stringify(publicClaims, null, 2));
            fixture.web_identity_token_file = path.join(directory, 'oidc.jwt');
            fs.writeFileSync(fixture.web_identity_token_file, token, {mode: 0o600, flag: 'wx'});
            fixture.credentials_file = '';
            fixture.cli_path = await io.which('aws', true);
            const fixturePath = path.join(directory, 'fixture.json');
            fs.writeFileSync(fixturePath, JSON.stringify(fixture), {mode: 0o600, flag: 'wx'});
            core.exportVariable('ASB_AWS_LIVE_FIXTURE', fixturePath);
      - name: Verify the allowed read and the explicit outside-object denial
        env:
          ASB_AWS_LIVE_CONFIRM: read-explicit-fixture
        run: |
          set -o pipefail
          "$RUNNER_TEMP/asb-s3-live.test" -test.run '^TestLiveS3Profile$' -test.v -test.timeout=90s | tee evidence/aws-gate.txt
          grep -F -- '--- PASS: TestLiveS3Profile' evidence/aws-gate.txt
          jq -n --arg commit "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            '{schema:"asb.s3-live-evidence/v1",commit:$commit,run_id:$run,os:"Linux",source:"github-oidc",allowed_read:true,outside_object_403:true}' > evidence/result.json
      - name: Verify the product process and recovery with real AWS
        env:
          ASB_AWS_LIVE_CONFIRM: read-explicit-fixture
          ASB_S3_LIVE_BINARY: ${{ runner.temp }}/asb-s3-live
        run: |
          set -o pipefail
          "$RUNNER_TEMP/asb-s3-product-live.test" -test.run '^TestLiveProductReadAndRestore$' -test.v -test.timeout=240s | tee evidence/product-gate.txt
          grep -F -- '--- PASS: TestLiveProductReadAndRestore' evidence/product-gate.txt
          binary_sha256=$(sha256sum "$ASB_S3_LIVE_BINARY" | cut -d ' ' -f 1)
          jq -n --arg commit "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg binary "$binary_sha256" \
            '{schema:"asb.s3-product-live-evidence/v1",commit:$commit,run_id:$run,os:"Linux",source:"github-oidc",binary_sha256:$binary,mtls_asb_read:true,restart_receipt_without_sts:true,sealed_backup_restore:true,old_authority_denied:true,restored_authorized_read:true,loopback_lab:true,organization_deployment_qualified:false}' > evidence/product-result.json
      - name: Verify dedicated-user operations and renewed identity
        if: inputs.operations_minutes == '15' || inputs.operations_minutes == '45'
        uses: actions/github-script@v8
        env:
          ASB_S3_OPERATIONS_MINUTES: ${{ inputs.operations_minutes }}
        with:
          script: |
            await require('./scripts/run-s3-operations.cjs')({core});
      - name: Verify real identity expiry and recovery in the installed systemd unit
        if: inputs.systemd_identity
        uses: actions/github-script@v8
        env:
          ASB_S3_OPERATIONS_MINUTES: ${{ inputs.operations_minutes }}
        with:
          script: |
            await require('./scripts/run-s3-systemd-live.cjs')({core});
      - name: Diagnose an unsuccessful OIDC gate without private error text
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const {spawnSync} = require('node:child_process');
            const directory = path.join(process.env.RUNNER_TEMP, 'asb-aws-private');
            const fixturePath = path.join(directory, 'fixture.json');
            if (!fs.existsSync(fixturePath)) return;
            if (!fs.existsSync('evidence/aws-gate.txt') || !fs.readFileSync('evidence/aws-gate.txt', 'utf8').includes('InvalidIdentityToken')) return;
            const fixture = JSON.parse(fs.readFileSync(fixturePath, 'utf8'));
            const token = fs.readFileSync(fixture.web_identity_token_file, 'utf8').trim();
            const parts = token.split('.');
            const header = JSON.parse(Buffer.from(parts[0], 'base64url'));
            const claims = JSON.parse(Buffer.from(parts[1], 'base64url'));
            const now = Math.floor(Date.now() / 1000);
            const diagnostic = {
              schema: 'asb.oidc-diagnostic/v1',
              algorithm_supported: header.alg === 'RS256',
              time_valid: Number.isInteger(claims.iat) && Number.isInteger(claims.exp) && claims.iat <= now && now < claims.exp && (claims.nbf === undefined || (Number.isInteger(claims.nbf) && claims.nbf <= now)),
              issuer_matches: claims.iss === 'https://token.actions.githubusercontent.com',
              audience_matches: claims.aud === 'sts.amazonaws.com',
            };
            try {
              const response = await fetch('https://token.actions.githubusercontent.com/.well-known/jwks', {signal: AbortSignal.timeout(10000)});
              if (!response.ok) throw new Error();
              const jwks = await response.json();
              const key = jwks.keys.find(key => key.kid === header.kid);
              diagnostic.signing_key_found = Boolean(key);
              diagnostic.signature_verified = header.alg === 'RS256' && Boolean(key) && crypto.verify('RSA-SHA256', Buffer.from(parts[0] + '.' + parts[1]), crypto.createPublicKey({key, format: 'jwk'}), Buffer.from(parts[2], 'base64url'));
            } catch {
              diagnostic.public_key_check_unavailable = true;
            }
            // Repeat only STS with the same single-object bound; never retry S3.
            const policy = JSON.stringify({Version: '2012-10-17', Statement: [
              {Effect: 'Deny', NotAction: 's3:GetObject', Resource: '*'},
              {Effect: 'Deny', Action: 's3:GetObject', NotResource: [fixture.resource]},
              {Effect: 'Allow', Action: 's3:GetObject', Resource: [fixture.resource]},
            ]});
            const emptyConfig = path.join(directory, 'diagnostic-empty-config');
            fs.writeFileSync(emptyConfig, '', {mode: 0o600, flag: 'wx'});
            const result = spawnSync(fixture.cli_path, [
              '--region', fixture.specification.region, '--endpoint-url', 'https://sts.' + fixture.specification.region + '.amazonaws.com',
              '--output', 'json', '--no-cli-pager', '--no-cli-auto-prompt', '--no-sign-request',
              'sts', 'assume-role-with-web-identity', '--web-identity-token', 'file://' + fixture.web_identity_token_file,
              '--role-arn', fixture.specification.role_arn, '--role-session-name', 'asb-oidc-diagnostic',
              '--duration-seconds', '900', '--policy', policy, '--query', 'PackedPolicySize',
            ], {encoding: 'utf8', timeout: 20000, maxBuffer: 65536, cwd: directory, env: {
              PATH: '/usr/bin:/bin', LANG: 'C', AWS_CONFIG_FILE: emptyConfig, AWS_SHARED_CREDENTIALS_FILE: emptyConfig,
              AWS_EC2_METADATA_DISABLED: 'true', AWS_STS_REGIONAL_ENDPOINTS: 'regional', AWS_MAX_ATTEMPTS: '1',
              AWS_PAGER: '', AWS_CLI_AUTO_PROMPT: 'off', AWS_CLI_ERROR_FORMAT: 'json',
            }});
            diagnostic.sts_exit_code = result.status;
            diagnostic.sts_probe_succeeded = result.status === 0;
            // Only words from this fixed vocabulary may appear in the artifact.
            // Unknown words, URLs, identifiers and token material are discarded.
            const vocabulary = new Set("a an and are as at be been by can cannot could couldn't did does doesn't failed failure for from has have id in invalid is it jwt key keys missing must no not of oidc on only openidconnect or parse provided provider required retrieve signature signed signer signing supported that the their this to token tokens too unable unknown unsupported url valid validation verify was were which with your audience account certificate configured expires expired expiry issuer claim claims found algorithm incorrect requested request response subject authentication format identity limit length size disabled thumbprint mismatch verification decode decoded byte character malformed unexpected".split(' '));
            try {
              const failure = JSON.parse(result.stderr);
              const codes = new Set(['InvalidIdentityToken', 'AccessDenied', 'ExpiredToken', 'IDPCommunicationError', 'IDPRejectedClaim', 'MalformedPolicyDocument', 'PackedPolicyTooLarge', 'RegionDisabled', 'Throttling', 'ValidationError']);
              diagnostic.sts_error_code = codes.has(failure.Code) ? failure.Code : 'unclassified';
              if (typeof failure.Message === 'string') {
                diagnostic.reason_words = (failure.Message.match(/[A-Za-z]+(?:'[A-Za-z]+)?/g) || []).slice(0, 96).map(word => vocabulary.has(word.toLowerCase()) ? word.toLowerCase() : '[omitted]');
              }
            } catch {
              diagnostic.sts_error_code = 'unclassified';
            }
            fs.writeFileSync('evidence/oidc-diagnostic.json', JSON.stringify(diagnostic, null, 2));
      - name: Remove projected identity and private fixture
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/asb-aws-private"
      - name: Save qualification evidence without credentials or object contents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asb-s3-aws-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
