name: ASB S3 Linux

on:
  push:
    branches: [main, feat/aws-s3-product]
    paths:
      - '.github/workflows/aws-s3-linux.yaml'
      - 'pkg/leastprivilege/**'
      - 'internal/s3product/**'
      - 'cmd/asb-s3/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - '.github/workflows/aws-s3-linux.yaml'
      - 'pkg/leastprivilege/**'
      - 'internal/s3product/**'
      - 'cmd/asb-s3/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
      - name: Verify dependencies
        run: go mod verify
      - name: Check least-privilege and AWS components
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          uname -s > evidence/operating-system.txt
          go test -race -count=1 -timeout=12m -json ./pkg/leastprivilege/... > evidence/tests.jsonl
          go vet ./pkg/leastprivilege/...
      - name: Save non-secret conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asb-s3-linux-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
