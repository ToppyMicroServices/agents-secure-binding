name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.6

      - name: Verify module downloads
        run: go mod verify

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.1

      - name: Build
        run: make

  mac-debug-a2a:
    runs-on: macos-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.6

      - name: Run macOS debug A2A integration
        run: GOTOOLCHAIN=go1.26.6+auto make mac-debug-a2a

  mac-human-coordination-e2e:
    runs-on: macos-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.6

      - name: Run macOS Human Coordination E2E
        run: GOTOOLCHAIN=go1.26.6+auto make mac-human-coordination-e2e

      - name: Validate Human Coordination evidence
        run: |
          jq empty build/human-coordination-e2e/evidence.json
          jq -e '.success == true' build/human-coordination-e2e/evidence.json
          jq -e '.mode == "debug-simple"' build/human-coordination-e2e/evidence.json
          jq -e '.production_claim == false' build/human-coordination-e2e/evidence.json
          jq -e '.runtime.software_only == true' build/human-coordination-e2e/evidence.json
          jq -e '.runtime.in_process == true' build/human-coordination-e2e/evidence.json
          jq -e '.runtime.network_calls == false' build/human-coordination-e2e/evidence.json
          jq -e '.runtime.live_tls == false' build/human-coordination-e2e/evidence.json
          jq -e '.runtime.hardware_attestation == false' build/human-coordination-e2e/evidence.json
          jq -e '.runtime.external_provider == false' build/human-coordination-e2e/evidence.json
          jq -e '.boundaries | length == 9' build/human-coordination-e2e/evidence.json
          jq -e '[.boundaries[] | select(.classification == "external-asb") | .profile_id] == ["asb.taskcoord-human-request/v1", "asb.taskcoord-agent-relay/v1"]' build/human-coordination-e2e/evidence.json
          jq -e 'all(.boundaries[]; (.evidence_source | length) > 0 and ((.classification == "external-asb" and (.profile_id | length) > 0) or (.classification == "trusted-internal" and ((.profile_id // "") | length) == 0)))' build/human-coordination-e2e/evidence.json

      - name: Upload Human Coordination evidence
        uses: actions/upload-artifact@v4
        with:
          name: human-coordination-e2e-evidence-macos
          path: build/human-coordination-e2e/evidence.json
          if-no-files-found: error
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        module: [agent, cli, cmd, internal, pkg, schemas, manager]
        include:
          - module: manager
            sudo: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.6

      - name: Create coverage directory
        run: mkdir -p coverage

      - name: Run tests for ${{ matrix.module }}
        run: |
          if [[ "${{ matrix.module }}" == "manager" ]]; then
            sudo GOTOOLCHAIN=go1.26.6+auto go test -v --race -covermode=atomic -coverprofile coverage/${{ matrix.module }}.out ./${{ matrix.module }}/...
          else
            GOTOOLCHAIN=go1.26.6+auto go test -v --race -covermode=atomic -coverprofile coverage/${{ matrix.module }}.out ./${{ matrix.module }}/...
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.module }}
          path: coverage/${{ matrix.module }}.out
          retention-days: 1

  upload-coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage/
          merge-multiple: true

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/*.out
          codecov_yml_path: codecov.yml
          verbose: true

  product-security:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum

      - name: Verify modules
        run: go mod verify

      - name: Run Direct-Agent core tests
        run: |
          GOTOOLCHAIN=go1.26.6+auto go test \
            ./pkg/atls/... \
            ./pkg/clients/... \
            ./pkg/agtp/... \
            ./pkg/production \
            ./cmd/redis-failover-redteam

      - name: Run Direct-Agent security red-team tests
        run: |
          GOTOOLCHAIN=go1.26.6+auto go test -v -race -count=1 \
            ./pkg/atls/identitypolicy \
            ./pkg/clients \
            ./pkg/production \
            ./cmd/redis-failover-redteam

      - name: Run Human coordination security tests
        run: |
          GOWORK=off GOTOOLCHAIN=go1.26.6+auto go test -race -count=1 \
            ./pkg/actionlifecycle \
            ./pkg/humanrelay/... \
            ./pkg/taskcoord/... \
            ./pkg/production \
            ./schemas \
            ./examples/human-coordination-e2e

      - name: Run three-node discovery soak gate
        env:
          ASB_DISCOVERY_SOAK: "1"
          ASB_DISCOVERY_SOAK_DURATION: "30s"
        run: |
          GOTOOLCHAIN=go1.26.6+auto go test -v -race -count=1 \
            ./pkg/agtp/discovery/peer -run '^TestPeerServiceSoak$'

      - name: Run protected-change consumer integration
        run: |
          GOTOOLCHAIN=go1.26.6+auto go test -v -race -count=1 \
            ./examples/protected-change-consumer

      - name: Run v1 and draft-06 v2 A2A negative integration
        run: |
          GOTOOLCHAIN=go1.26.6+auto go test -v -race -count=1 \
            ./examples/a2a-multiprocess

      - name: Run bounded fuzz smoke
        run: |
          GOTOOLCHAIN=go1.26.6+auto go test -run '^$' \
            -fuzz=FuzzVerifySessionIdentityJWTRejectsMalformedCompactTokens \
            -fuzztime=10s ./pkg/agtp

      - name: Run govulncheck
        run: ./scripts/check-attestation-vulnerabilities.sh root
