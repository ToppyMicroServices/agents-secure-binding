name: CI
on:
  workflow_dispatch:
    inputs:
      linux_only:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  runtime-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
      - name: Build containment test binary
        run: go test -race -p 1 -c -o /tmp/asb-process-containment.test ./agent/algorithm
      - name: Require nested descendant teardown
        run: |
          sudo ASB_REQUIRE_NESTED_PID_NAMESPACE=1 /tmp/asb-process-containment.test \
            -test.v -test.timeout=60s -test.run '^TestContainedCommandDescendantLifetime$/^nested$/^(success|error|stop)$'
      - name: Run unprivileged execution and resource regressions
        run: go test -race -p 1 ./agent/... ./pkg/oci -count=1
